<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F3EE; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F3EE; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#10192A; padding:32px 24px;">
              <img src="{{ logo_url }}" alt="Ngima Wangai & Company Advocates" width="140" style="display:block; height:auto;">
            </td>
          </tr>

          <!-- Brass accent rule -->
          <tr>
            <td style="background-color:#A9824C; height:3px; line-height:3px; font-size:0;">&nbsp;</td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px 40px 24px 40px;">
              <h1 style="margin:0 0 20px 0; font-family: Georgia, 'Times New Roman', serif; font-size:24px; line-height:1.3; color:#10192A;">
                You have a new reply
              </h1>
              <p style="margin:0 0 16px 0; font-size:15px; line-height:1.7; color:#3A4250;">
                Hi {{ name|default:"there" }},
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F3EE; border-left:3px solid #A9824C; border-radius:8px; margin: 0 0 20px 0;">
                <tr>
                  <td style="padding: 18px 20px; font-size:15px; line-height:1.7; color:#10192A; font-style:italic;">
                    {{ message|linebreaks }}
                  </td>
                </tr>
              </table>
              <p style="margin:0; font-size:15px; line-height:1.7; color:#3A4250;">
                Reply below and verify with this email address to keep the conversation going.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="center" style="padding: 8px 40px 40px 40px;">
              <a href="{{ site_url }}"
                 style="display:inline-block; background-color:#E8631F; color:#ffffff; text-decoration:none; font-weight:bold; font-size:15px; padding:14px 32px; border-radius:999px;">
                Continue the Conversation
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#10192A; padding:32px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="64" valign="top">
                    <img src="{{ footer_image_url }}" alt="" width="56" style="display:block; height:56px; width:56px; border-radius:50%; object-fit:cover;">
                  </td>
                  <td valign="top" style="padding-left:16px; color:#B7BEC9; font-size:12px; line-height:1.6;">
                    <p style="margin:0 0 4px 0; color:#ffffff; font-weight:bold; font-size:13px;">Ngima Wangai &amp; Company Advocates</p>
                    <p style="margin:0;">Nairobi, Kenya</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

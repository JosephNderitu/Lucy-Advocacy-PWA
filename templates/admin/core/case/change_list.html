{% extends "admin/change_list.html" %}
{% block content %}
<div style="display:flex;gap:16px;margin:0 0 20px;">
  <div style="flex:1;background:#EEF7F8;border-radius:12px;padding:18px 22px;">
    <div style="font-size:30px;font-weight:700;color:#2F7178;">{{ open_cases }}</div>
    <div style="font-size:13px;color:#454A58;font-weight:600;">Open cases</div>
  </div>
  <div style="flex:1;background:#fef3c7;border-radius:12px;padding:18px 22px;">
    <div style="font-size:30px;font-weight:700;color:#92400e;">{{ pending_documents }}</div>
    <div style="font-size:13px;color:#454A58;font-weight:600;">Documents awaiting confirmation</div>
  </div>
  <div style="flex:1;background:#fff1e8;border-radius:12px;padding:18px 22px;">
    <div style="font-size:30px;font-weight:700;color:#DD6812;">{{ pending_requests }}</div>
    <div style="font-size:13px;color:#454A58;font-weight:600;">Open document requests</div>
  </div>
</div>
{{ block.super }}
{% endblock %}

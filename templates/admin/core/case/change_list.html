{% extends "admin/change_list.html" %}
{% block content %}
<div class="row">
  <div class="col-12 col-md-4">
    <div class="info-box"><span class="info-box-icon" style="background:#2F7178;color:#fff"><i class="fas fa-briefcase"></i></span>
      <div class="info-box-content"><span class="info-box-text">Open cases</span>
        <span class="info-box-number">{{ open_cases }}</span></div></div>
  </div>
  <div class="col-6 col-md-4">
    <div class="info-box"><span class="info-box-icon" style="background:#DD6812;color:#fff"><i class="fas fa-file-circle-exclamation"></i></span>
      <div class="info-box-content"><span class="info-box-text">Documents to review</span>
        <span class="info-box-number">{{ pending_documents }}</span></div></div>
  </div>
  <div class="col-6 col-md-4">
    <div class="info-box"><span class="info-box-icon" style="background:#3F9199;color:#fff"><i class="fas fa-hourglass-half"></i></span>
      <div class="info-box-content"><span class="info-box-text">Awaiting clients</span>
        <span class="info-box-number">{{ pending_requests }}</span></div></div>
  </div>
</div>
{{ block.super }}
{% endblock %}
